<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanos 2.0 Inversion Control Panel</title>
    <style>
        :root {
            --bg-color: #0B0C10;
            --card-bg: #1F2833;
            --accent: #66FCF1;
            --text-main: #C5C6C7;
            --text-bright: #FFFFFF;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2e3c4e;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            color: var(--accent);
            font-size: 24px;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #2e3c4e;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-bright);
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: var(--text-bright);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #0b0c10;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover {
            box-shadow: 0 0 15px var(--accent);
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .info { background: #1c2b3d; border: 1px solid #2e5c8a; color: #a5c9f3; }
        .success { background: #1c3d27; border: 1px solid #2e7d32; color: #a5d6a7; }
        .error { background: #421d1d; border: 1px solid #c62828; color: #ef9a9a; }
        .log-link { color: #66FCF1; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Inversion Core Dashboard</h1>
    
    <div class="form-group">
        <label for="githubToken">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="githubToken" placeholder="paste your token here">
    </div>

    <div class="form-group">
        <label for="topicSelect">Select Vector (Target Domain)</label>
        <select id="topicSelect">
            <option value="Gross Domestic Product (GDP)">Gross Domestic Product (GDP)</option>
            <option value="Economic Inequality and Wealth Distribution">Economic Inequality</option>
            <option value="Systemic Ruin of Education and Commodity Extraction">Education & Commodity Extraction</option>
            <option value="Climate Change and Resource Exhaustion">Climate Change</option>
            <option value="Artificial General Intelligence (AGI) Allocation">AI / AGI Scaling</option>
        </select>
    </div>

    <div class="form-group">
        <label for="formatSelect">Select Output Vehicle / Target Persona</label>
        <select id="formatSelect">
            <option value="Short System Profile">Short System Profile</option>
            <option value="Medium System Profile">Medium System Profile</option>
            <option value="Long System Profiler">Long System Profiler</option>
            <option value="X (Twitter) Post Thread">X (Twitter) Post Thread</option>
            <option value="LinkedIn Post Asset">LinkedIn Post Asset</option>
            <option value="YouTube Video Script">YouTube Video Script</option>
            <option value="Institutional Investor Pitch">Institutional Investor Pitch</option>
            <option value="Academic University Professor Abstract Paper">University Professor Paper</option>
            <option value="Easy snapshot">Easy snapshot</option>
        </select>
    </div>

    <button id="runBtn" onclick="triggerEnginePipeline()">Launch Inversion Engine</button>
    <div id="status" class="status-box"></div>
</div>

<script>
    document.getElementById('githubToken').value = localStorage.getItem('humanos_pat') || '';

    async function triggerEnginePipeline() {
        const token = document.getElementById('githubToken').value;
        const topic = document.getElementById('topicSelect').value;
        const format = document.getElementById('formatSelect').value;
        const runBtn = document.getElementById('runBtn');

        if (!token) {
            showStatus('❌ Error: GitHub Token is required!', 'error');
            return;
        }

        localStorage.setItem('humanos_pat', token);
        runBtn.disabled = true;
        showStatus('⏳ Transmitting signal to GitHub Actions cloud server...', 'info');

        const repoOwner = "justicephysics";
        const repoName = "Nalanda";
        const dispatchUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/dispatches`;

        try {
            const response = await fetch(dispatchUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: "dashboard_trigger",
                    client_payload: { topic: topic, format: format }
                })
            });

            if (response.status === 204) {
                showStatus('🟡 [1/3] Signal Received by GitHub. Waiting for Cloud Runner to initialize...', 'info');
                // Start live polling of the workflow runner
                pollWorkflowStatus(token, repoOwner, repoName, Date.now());
            } else {
                const errorData = await response.json().catch(() => ({ message: 'Endpoint mismatch' }));
                showStatus(`❌ API Dispatch Error (${response.status}): ${errorData.message}`, 'error');
                runBtn.disabled = false;
            }
        } catch (err) {
            showStatus(`❌ Connection Failure: ${err.message}`, 'error');
            runBtn.disabled = false;
        }
    }

    async function pollWorkflowStatus(token, owner, repo, triggerTime) {
        const runsUrl = `https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=3`;
        const runBtn = document.getElementById('runBtn');
        let checks = 0;

        const interval = setInterval(async () => {
            checks++;
            try {
                const res = await fetch(runsUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const latestRun = data.workflow_runs[0];
                    const status = latestRun.status;         // queued, in_progress, completed
                    const conclusion = latestRun.conclusion; // success, failure, null
                    const htmlUrl = latestRun.html_url;

                    if (status === 'queued') {
                        showStatus(`🟡 [1/3] Cloud Runner Queued... (Attempt ${checks})`, 'info');
                    } else if (status === 'in_progress') {
                        showStatus(`🔵 [2/3] Cloud Runner Active! Executing Python Engine & Diagnostics...\n\n🔗 View Live Terminal: <a href="${htmlUrl}" target="_blank" class="log-link">Click Here to Watch Logs Live</a>`, 'info');
                    } else if (status === 'completed') {
                        clearInterval(interval);
                        runBtn.disabled = false;
                        if (conclusion === 'success') {
                            showStatus(`🟢 [3/3] SUCCESS! Master report compiled and published live!\n\n👉 <a href="index.html" class="log-link">Open Public Portal (index.html) to view report</a>`, 'success');
                        } else {
                            showStatus(`🔴 [3/3] CLOUD RUNNER FAILED (${conclusion.toUpperCase()})!\n\n👉 <a href="${htmlUrl}" target="_blank" class="log-link">Click here to open GitHub Logs and see exact error</a>`, 'error');
                        }
                    }
                }
            } catch (e) {
                console.error("Polling error:", e);
            }

            if (checks > 30) { // Timeout after ~2.5 mins
                clearInterval(interval);
                runBtn.disabled = false;
                showStatus('⚠️ Timed out waiting for status update. Please check the Actions tab on GitHub manually.', 'error');
            }
        }, 5000); // Check every 5 seconds
    }

    function showStatus(msg, type) {
        const statusBox = document.getElementById('status');
        statusBox.style.display = 'block';
        statusBox.className = `status-box ${type}`;
        statusBox.innerHTML = msg.replace(/\n/g, '<br>');
    }
</script>
</body>
</html>
