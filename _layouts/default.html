<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Justice Physics Nalanda</title>
    
    <!-- Early script to prevent theme flashing (FOUC) -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme') || 'dark';
        if (saved === 'light') document.documentElement.classList.add('light-mode');
      })();
    </script>

    <style>
        /* Dark mode (default) */
        :root {
            --bg: #0B1A2F;
            --surface: #112240;
            --text: #ffffff;
            --text-secondary: #cccccc;
            --accent: #7FDBFF;
            --border: #1a3a5c;
            --radius: 10px;
        }
        /* Light mode */
        html.light-mode {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #444444;
            --accent: #0077b6;
            --border: #d0d7de;
        }
        
        /* Force enable text selection/copying */
        * {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.1rem;
            line-height: 1.7;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1, h2, h3, h4 { color: var(--accent); margin-top: 1.5rem; margin-bottom: 1rem; }
        
        /* Standard paragraph behavior */
        p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        a { color: var(--accent); }
        
        /* Table Wrapper for Horizontal Scrolling */
        .table-wrapper {
            overflow-x: auto; overflow-y: hidden; margin: 1.5rem 0;
            border-radius: var(--radius); border: 1px solid var(--border); scrollbar-width: thin;
        }
        .table-wrapper::-webkit-scrollbar { height: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb { background-color: transparent; border-radius: 10px; transition: background-color 0.3s; }
        .table-wrapper:hover::-webkit-scrollbar-thumb { background-color: var(--border); }

        table { width: 100%; border-collapse: collapse; margin: 0; background: var(--surface); }
        th, td { border: 1px solid var(--border); padding: 0.8rem 1rem; text-align: left; vertical-align: top; white-space: normal; }
        th { color: var(--text); background: rgba(127, 219, 255, 0.05); white-space: nowrap; }
        td:nth-child(2), td:nth-child(3), td:nth-child(4) { text-align: right; white-space: nowrap; }

        code { background: var(--surface); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: 'Courier New', monospace; color: var(--accent); }
        pre { background: var(--surface); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; }
        pre code { background: none; padding: 0; }
        blockquote { border-left: 4px solid var(--accent); padding-left: 1rem; margin: 1.5rem 0; color: var(--text-secondary); }
        hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
        
        /* Controls Bar */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap; }
        .back-link { text-decoration: none; color: var(--accent); font-weight: 600; border: 1px solid var(--accent); padding: 0.45rem 1rem; border-radius: var(--radius); transition: background 0.2s, color 0.2s; }
        .back-link:hover { background: var(--accent); color: var(--bg); }
        .theme-btn { color: var(--accent); font-weight: 600; font-size: 0.95rem; padding: 0.45rem 1rem; border: 1px solid var(--accent); border-radius: var(--radius); background: transparent; cursor: pointer; font-family: inherit; transition: background 0.2s, color 0.2s; }
        .theme-btn:hover { background: var(--accent); color: var(--bg); }

        /* Standard Native Bullet Points */
        ul, ol {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        li {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        li > p {
            margin-bottom: 0;
        }
        
        /* ISOLATED MATH SLIDER & WEIGHT CONTROL */
        mjx-container {
            display: inline-block !important;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            vertical-align: middle;
            padding-bottom: 4px;
            font-size: 0.95em !important; /* Slightly shrinks the math container relative to text */
            font-weight: normal !important; /* Prevents math from looking thick/bold */
        }
        mjx-container::-webkit-scrollbar { height: 6px; }
        mjx-container::-webkit-scrollbar-track { background: transparent; }
        mjx-container::-webkit-scrollbar-thumb {
            background-color: transparent; border-radius: 10px; transition: background-color 0.3s;
        }
        mjx-container:hover::-webkit-scrollbar-thumb { background-color: var(--border); }

        mjx-container[display="true"] {
            display: block !important;
            margin: 1rem 0;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            padding-bottom: 0.5rem;
        }
        mjx-container[display="true"]::-webkit-scrollbar { height: 6px; }
        mjx-container[display="true"]::-webkit-scrollbar-track { background: transparent; }
        mjx-container[display="true"]::-webkit-scrollbar-thumb {
            background-color: transparent; border-radius: 10px; transition: background-color 0.3s;
        }
        mjx-container[display="true"]:hover::-webkit-scrollbar-thumb { background-color: var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <a href="https://justicephysics.github.io/Nalanda/" class="back-link">← Back to Blueprint</a>
            <button type="button" id="theme-toggle" class="theme-btn" onclick="toggleTheme()">🌓 Day / Night</button>
        </div>
        {{ content }}
    </div>

    <!-- Pre-process math to fix inline $$, unescaped %, \% inside \text{}, and Unicode symbols (₹, –) -->
    <script>
      (function() {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while ((node = walker.nextNode())) {
          let text = node.nodeValue;
          if (text.includes('$') || text.includes('\\(')) {
            // 1. Convert inline $$...$$ to $...$ if there is text before or after it on the same line
            if (text.includes('$$')) {
              text = text.replace(/\$\$([^\n$]+)\$\$/g, (match, inner, offset, string) => {
                const before = string.substring(0, offset);
                const after = string.substring(offset + match.length);
                if (before.trim() || after.trim()) {
                  return `$${inner}$`;
                }
                return match;
              });
            }

            // 2. Fix unescaped %, \% inside \text{}, and unsupported Unicode
            const newText = text.replace(/(\$\$[\s\S]+?\$\$|\$[^$]+\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\])/g, (match) => {
              let fixed = match.split('\\%').join('§ESC§');
              fixed = fixed.replace(/%/g, '\\%');
              fixed = fixed.split('§ESC§').join('\\%');
              
              // Fix \% inside \text{...}
              fixed = fixed.replace(/\\text\{([^{}]*)\}/g, (m) => m.split('\\%').join('$\\%$'));
              
              // Wrap unsupported Unicode characters (₹, –) in \text{} to prevent Math input errors
              fixed = fixed.replace(/₹/g, '\\text{₹}');
              fixed = fixed.replace(/–/g, '\\text{–}');
              
              return fixed;
            });
            node.nodeValue = newText;
          }
        }
      })();
    </script>

    <!-- MathJax v3 for Equations -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        chtml: {
          linebreaks: { automatic: false },
          // =====================================================================
          // >>> MANUALLY ADJUST MATH SIZE HERE <<<
          // Change this number to make math smaller (e.g., 0.8) or larger (e.g., 1.0)
          // =====================================================================
          scale: 0.85, 
          minScale: 0.5
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

    <!-- Mermaid for Flowcharts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        const themeBtn = document.getElementById('theme-toggle');

        function setTheme(mode) {
            if (mode === 'light') {
                document.documentElement.classList.add('light-mode');
                themeBtn.textContent = '🌙 Night Mode';
            } else {
                document.documentElement.classList.remove('light-mode');
                themeBtn.textContent = '☀️ Day Mode';
            }
            renderMermaid(mode);
        }

        window.toggleTheme = function() {
            const isLight = document.documentElement.classList.contains('light-mode');
            const newMode = isLight ? 'dark' : 'light';
            localStorage.setItem('theme', newMode);
            setTheme(newMode);
        };

        function renderMermaid(theme) {
            if (typeof mermaid === 'undefined') return;
            const mermaidTheme = theme === 'light' ? 'default' : 'dark';
            mermaid.initialize({ startOnLoad: false, theme: mermaidTheme, securityLevel: 'loose' });
            document.querySelectorAll('.mermaid').forEach(div => {
                const originalCode = div.getAttribute('data-original-code');
                if (originalCode) {
                    div.removeAttribute('data-processed');
                    div.innerHTML = originalCode;
                }
            });
            mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('table').forEach(function(table) {
                const wrapper = document.createElement('div');
                wrapper.className = 'table-wrapper';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            });

            document.querySelectorAll('code.language-mermaid').forEach(function (block) {
                const div = document.createElement('div');
                div.className = 'mermaid';
                
                // Auto-fix Mermaid syntax: Wrap node text containing | in quotes
                let code = block.textContent;
                code = code.replace(/\[([^\]"[]*\|[^\]"[]*)\]/g, '["$1"]');
                code = code.replace(/\{([^\}"{]*\|[^\}"{]*)\}/g, '{"$1"}');
                code = code.replace(/\(([^\)"(]*\|[^\)"(]*)\)/g, '("$1")');
                
                div.textContent = code;
                block.parentElement.replaceWith(div);
            });

            document.querySelectorAll('.mermaid').forEach(div => {
                div.setAttribute('data-original-code', div.textContent);
            });

            const saved = localStorage.getItem('theme') || 'dark';
            setTheme(saved);
        });
    </script>
</body>
</html>
