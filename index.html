<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justice Physics Nalanda // Systemic Inversion Ledger</title>
  <style>
    :root {
      --bg-color: #0B0C10;
      --card-bg: #1F2833;
      --accent: #66FCF1;
      --accent-dim: #45A29E;
      --text-main: #C5C6C7;
      --text-bright: #FFFFFF;
      --warning: #FF3B30;
      --border-color: #2e3c4e;
      --badge-bg: #1c232d;
    }

    /* Light theme overrides */
    body.light-theme {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-bright: #1a202c;
      --accent: #0284c7;
      --accent-dim: #0369a1;
      --border-color: #e2e8f0;
      --badge-bg: #edf2f7;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }
    .sidebar {
      width: 320px;
      background: #11141a;
      border-right: 1px solid var(--border-color);
      padding: 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, border-color 0.3s;
    }
    body.light-theme .sidebar {
      background: #eef2f6;
    }
    .sidebar h2 {
      color: var(--accent);
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .discipline-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 15px;
      text-align: left;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    .discipline-btn:hover, .discipline-btn.active {
      background: var(--card-bg);
      border-color: var(--accent);
      color: var(--text-bright);
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    body.light-theme .discipline-btn:hover,
    body.light-theme .discipline-btn.active {
      background: var(--card-bg);
      color: var(--text-bright);
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.2);
    }
    .main-content {
      flex: 1;
      padding: 40px 50px;
      box-sizing: border-box;
      max-width: 1000px;
    }
    header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    header h1 {
      color: var(--text-bright);
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }
    .status-badge {
      display: inline-block;
      background: var(--badge-bg);
      border: 1px solid var(--accent-dim);
      color: var(--accent);
      padding: 4px 10px;
      font-family: monospace;
      border-radius: 4px;
      font-size: 12px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-btn {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .theme-btn:hover {
      box-shadow: 0 0 8px var(--accent);
    }
    .report-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .report-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.3s;
    }
    .report-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-dim);
    }
    .report-meta {
      font-family: monospace;
      font-size: 12px;
      color: var(--accent-dim);
      margin-bottom: 8px;
    }
    .report-title {
      color: var(--text-bright);
      font-size: 20px;
      margin: 0 0 12px 0;
    }
    .master-link {
      display: inline-block;
      color: #0b0c10;
      background: var(--accent);
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .master-link:hover {
      box-shadow: 0 0 12px var(--accent);
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      color: var(--accent-dim);
      font-style: italic;
    }
    body.light-theme .empty-state {
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>📚 Discipline Vectors</h2>
    <button class="discipline-btn active" onclick="switchDiscipline('Education', this)">1. Education</button>
    <button class="discipline-btn" onclick="switchDiscipline('Economics', this)">2. Economics</button>
    <button class="discipline-btn" onclick="switchDiscipline('Ecology', this)">3. Ecology</button>
    <button class="discipline-btn" onclick="switchDiscipline('AI-AGI', this)">4. AI / AGI</button>
  </div>

  <div class="main-content">
    <header>
      <div>
        <h1 id="disciplineTitle">Education</h1>
        <div class="status-badge">📡 SYSTEM STATUS: ACTIVE // LEDGER READY</div>
      </div>
      <div class="header-right">
        <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">🌙 Night Mode</button>
      </div>
    </header>
    <div id="reportsContainer" class="report-grid"></div>
  </div>

  <script>
    // ----- THEME TOGGLE -----
    function applySavedTheme() {
      const savedTheme = localStorage.getItem('nalanda_theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeToggleBtn').textContent = '☀️ Day Mode';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('themeToggleBtn').textContent = '🌙 Night Mode';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('nalanda_theme', isLight ? 'light' : 'dark');
      const btn = document.getElementById('themeToggleBtn');
      btn.textContent = isLight ? '☀️ Day Mode' : '🌙 Night Mode';
    }

    // ----- DISPLAY LOGIC (unchanged) -----
    let currentDiscipline = "Education";
    let masterRegistry = [];

    async function fetchRegistryData() {
      try {
        const response = await fetch('registry.json');
        const data = await response.json();
        masterRegistry = data.reports || [];
        renderActiveReports();
      } catch (err) {
        document.getElementById('reportsContainer').innerHTML =
          '<div class="empty-state">⚠️ Unable to load registry. Please ensure the engine has been run at least once.</div>';
      }
    }

    function switchDiscipline(disciplineName, element) {
      currentDiscipline = disciplineName;
      document.getElementById('disciplineTitle').innerText = disciplineName;
      document.querySelectorAll('.discipline-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
      renderActiveReports();
    }

    function renderActiveReports() {
      const container = document.getElementById('reportsContainer');
      const filtered = masterRegistry.filter(r => r.discipline === currentDiscipline);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            No reports found for <strong>${currentDiscipline}</strong>.
          </div>`;
        return;
      }

      filtered.sort((a, b) => (a.date_ist || '').localeCompare(b.date_ist || ''));

      container.innerHTML = filtered.map(report => `
        <div class="report-card">
          <div class="report-meta">
            📄 ID: ${report.id || 'N/A'} // 📅 ${report.date || 'Unknown'} ${report.time ? `// ⏰ ${report.time}` : ''}
          </div>
          <h3 class="report-title">${report.title || 'Untitled Report'}</h3>
          <p style="color: var(--text-main); font-size: 14px; margin-bottom: 16px;">
            <strong>Topic:</strong> ${report.topic || 'N/A'}
            <span style="margin-left: 20px;"><strong>Format:</strong> ${report.format || 'N/A'}</span>
          </p>
          <a href="reader.html?file=${encodeURIComponent(report.file)}" class="master-link">
            📖 Open Master Document →
          </a>
        </div>
      `).join('');
    }

    window.onload = function() {
      applySavedTheme();
      fetchRegistryData();
    };
  </script>
</body>
</html>
