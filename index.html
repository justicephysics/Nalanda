<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanos 2.0 Inversion Control Panel</title>
    <style>
        :root {
            --bg-color: #0B0C10;
            --card-bg: #1F2833;
            --accent: #66FCF1;
            --text-main: #C5C6C7;
            --text-bright: #FFFFFF;
            --warning: #F2A900;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #2e3c4e;
        }
        h1 {
            color: var(--accent);
            font-size: 24px;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #2e3c4e;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-bright);
            font-weight: 600;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: var(--text-bright);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #0b0c10;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #45a29e;
            box-shadow: 0 0 15px var(--accent);
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-family: monospace;
            font-size: 13px;
        }
        .success { background: #1c3d27; border: 1px solid #2e7d32; color: #a5d6a7; }
        .error { background: #421d1d; border: 1px solid #c62828; color: #ef9a9a; }
        .hint { font-size: 11px; color: #85878a; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Inversion Core Dashboard</h1>
    
    <div class="form-group">
        <label for="githubToken">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="githubToken" placeholder="paste your github_pat_... token here">
        <div class="hint">Saved securely in your browser's local storage only. Needed to trigger the action run.</div>
    </div>

    <div class="form-group">
        <label for="topicSelect">Select Vector (Target Domain)</label>
        <select id="topicSelect">
            <option value="Gross Domestic Product (GDP)">Gross Domestic Product (GDP)</option>
            <option value="Economic Inequality and Wealth Distribution">Economic Inequality</option>
            <option value="Climate Change and Resource Exhaustion">Climate Change</option>
            <option value="Artificial General Intelligence (AGI) Allocation">AI / AGI Scaling</option>
        </select>
    </div>

    <div class="form-group">
        <label for="formatSelect">Select Output Vehicle / Target Persona</label>
        <select id="formatSelect">
            <option value="Short Note Summary">Short Note Profile</option>
            <option value="Medium Technical Briefing">Medium Note Profile</option>
            <option value="Long Comprehensive System Ledger">Long System Ledger</option>
            <option value="X (Twitter) Thread Format">X (Twitter) Post Thread</option>
            <option value="LinkedIn Professional Article Format">LinkedIn Post Asset</option>
            <option value="Instagram Descriptive Carousel Text">Instagram Content Script</option>
            <option value="YouTube Script Narrative Arc with Visual Markers">YouTube Video Script</option>
            <option value="Institutional Investor Strategy Pitch Brief">Institutional Investor Pitch</option>
            <option value="Academic University Professor Abstract Paper">University Professor Paper</option>
        </select>
    </div>

    <button id="runBtn" onclick="triggerEnginePipeline()">Launch Inversion Engine</button>

    <div id="status" class="status-box"></div>
</div>

<script>
    // Automatically load token from local browser storage on page boot
    document.getElementById('githubToken').value = localStorage.getItem('humanos_pat') || '';

    async function triggerEnginePipeline() {
        const token = document.getElementById('githubToken').value;
        const topic = document.getElementById('topicSelect').value;
        const format = document.getElementById('formatSelect').value;
        const statusBox = document.getElementById('status');
        const runBtn = document.getElementById('runBtn');

        if (!token) {
            showStatus('❌ Error: GitHub Token is required to execute remote tasks!', 'error');
            return;
        }

        // Save to browser memory securely
        localStorage.setItem('humanos_pat', token);
        
        runBtn.disabled = true;
        runBtn.innerText = "Transmitting Telemetry...";
        showStatus('⏳ Dispatching payload variables to GitHub Actions network core...', 'success');

        // Target coordinates for your specific repo configuration
        const repoOwner = "justicephysics";
        const repoName = "humanos2.0";
        const workflowId = "pipeline.yml"; 

        const url = `https://api.github.com/repos/${repoOwner}/${repoName}/actions/workflows/${workflowId}/dispatches`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        topic: topic,
                        format: format
                    }
                })
            });

            if (response.status === 204) {
                showStatus('🚀 SUCCESS! Inversion engine activated on GitHub server. Your report is compiling. Check your /staged_outputs folder in 45 seconds!', 'success');
            } else {
                const errorData = await response.json().catch(() => ({ message: 'Authorization / Endpoint error.' }));
                showStatus(`❌ API Error (${response.status}): ${errorData.message}`, 'error');
            }
        } catch (err) {
            showStatus(`❌ Connection Crash: ${err.message}`, 'error');
        } finally {
            runBtn.disabled = false;
            runBtn.innerText = "Launch Inversion Engine";
        }
    }

    function showStatus(msg, type) {
        const statusBox = document.getElementById('status');
        statusBox.style.display = 'block';
        statusBox.className = `status-box ${type}`;
        statusBox.innerText = msg;
    }
</script>
</body>
</html>
