<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Core Reader</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent: #66fcf1;
            --border-color: #2e3c4e;
            --badge-bg: #151c24;
        }

        body.light-theme {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --accent: #0284c7;
            --border-color: #e2e8f0;
            --badge-bg: #edf2f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            padding: 20px;
            max-width: 920px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn, .theme-btn {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .meta-console {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }

        .meta-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--accent);
            font-weight: 600;
            font-family: monospace;
        }

        .debug-panel {
            background: #05080c;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #00ff66;
            max-height: 250px;
            overflow-y: auto;
        }

        .debug-log-entry { margin: 3px 0; word-break: break-all; }
        .debug-log-entry.info { color: #38bdf8; }
        .debug-log-entry.success { color: #4ade80; }
        .debug-log-entry.warn { color: #facc15; }
        .debug-log-entry.error { color: #f87171; font-weight: bold; }

        .content-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1, h2, h3 { color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; display: block; overflow-x: auto; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: left; }
    </style>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="back-btn">← Portal Index</a>
    <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">🌙 Night Mode</button>
</div>

<div class="meta-console" id="metaConsole">
    <span>⏳ Initializing Reader...</span>
</div>

        🔍 EXECUTION CONSOLE
    </div>
    <div id="debugLogs"></div>
</div>

<div class="content-card" id="documentRenderArea">
    <p>⏳ Waiting for document pipeline...</p>
</div>

<!-- Load CDN scripts dynamically at bottom with fallback error handlers -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

<script>
    function logDebug(message, type = 'info') {
        const logsDiv = document.getElementById('debugLogs');
        const timestamp = new Date().toLocaleTimeString();
        const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warn' ? '⚠️' : 'ℹ️';
        
        const entry = document.createElement('div');
        entry.className = `debug-log-entry ${type}`;
        entry.textContent = `[${timestamp}] ${icon} ${message}`;
        if (logsDiv) {
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
    }

    function applySavedTheme() {
        const savedTheme = localStorage.getItem('nalanda_theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
        }
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('nalanda_theme', isLight ? 'light' : 'dark');
        window.location.reload();
    }

    function sanitizeLatexForKaTeX(rawText) {
    if (!rawText) return '';
    let cleaned = rawText;
    
    // ============================================================
    // STEP 1: Basic whitespace and encoding cleanup
    // ============================================================
    cleaned = cleaned.replace(/\t/g, ' ');
    cleaned = cleaned.replace(/\r\n/g, '\n');
    cleaned = cleaned.replace(/\r/g, '\n');
    
    // ============================================================
    // STEP 2: Fix Gemini-specific corruption patterns
    // ============================================================
    // Fix: \#\# 2 -> ## 2
    cleaned = cleaned.replace(/\\#\\#/g, '##');
    cleaned = cleaned.replace(/\\#/g, '#');
    cleaned = cleaned.replace(/\\times/g, '×');
    cleaned = cleaned.replace(/\\cdot/g, '·');
    cleaned = cleaned.replace(/\\quad/g, '  ');
    
    // ============================================================
    // STEP 3: Handle display math blocks \[...\] and $$...$$
    // ============================================================
    // These are the main problem areas - they contain text that KaTeX can't render
    
    // 3a: Extract content from \[ ... \] and convert to plain text
    cleaned = cleaned.replace(
        /\\\[([\s\S]*?)\\\]/g,
        function(match, content) {
            // Remove any remaining \text{} commands and extract text
            let text = content;
            // Handle \text{...} inside
            text = text.replace(/\\text\{([^}]*?)\}/g, '$1');
            // Handle \text{frac}{...} pattern
            text = text.replace(/\\text\{frac\}\{([^}]*?)\}\{([^}]*?)\}/g, function(m, num, den) {
                return num + '/' + den;
            });
            // Handle \frac{...}{...} pattern
            text = text.replace(/\\frac\{([^}]*?)\}\{([^}]*?)\}/g, function(m, num, den) {
                return num + '/' + den;
            });
            // Handle \propto
            text = text.replace(/\\propto/g, '∝');
            // Handle \to
            text = text.replace(/\\to/g, '→');
            // Handle \rightarrow
            text = text.replace(/\\rightarrow/g, '→');
            // Handle \Rightarrow
            text = text.replace(/\\Rightarrow/g, '⇒');
            // Handle \approx
            text = text.replace(/\\approx/g, '≈');
            // Handle \infty
            text = text.replace(/\\infty/g, '∞');
            // Remove remaining backslashes
            text = text.replace(/\\/g, '');
            // Fix spaces around arrows
            text = text.replace(/\s*→\s*/g, ' → ');
            text = text.replace(/\s*⇒\s*/g, ' ⇒ ');
            text = text.replace(/\s*∝\s*/g, ' ∝ ');
            // Clean up extra spaces
            text = text.replace(/\s{2,}/g, ' ');
            return text.trim();
        }
    );
    
    // 3b: Handle $$ ... $$ blocks
    cleaned = cleaned.replace(
        /\$\$([\s\S]*?)\$\$/g,
        function(match, content) {
            let text = content;
            text = text.replace(/\\text\{([^}]*?)\}/g, '$1');
            text = text.replace(/\\frac\{([^}]*?)\}\{([^}]*?)\}/g, function(m, num, den) {
                return num + '/' + den;
            });
            text = text.replace(/\\propto/g, '∝');
            text = text.replace(/\\to/g, '→');
            text = text.replace(/\\rightarrow/g, '→');
            text = text.replace(/\\Rightarrow/g, '⇒');
            text = text.replace(/\\approx/g, '≈');
            text = text.replace(/\\infty/g, '∞');
            text = text.replace(/\\/g, '');
            text = text.replace(/\s*→\s*/g, ' → ');
            text = text.replace(/\s*⇒\s*/g, ' ⇒ ');
            text = text.replace(/\s*∝\s*/g, ' ∝ ');
            text = text.replace(/\s{2,}/g, ' ');
            return text.trim();
        }
    );
    
    // ============================================================
    // STEP 4: Handle inline \text{...} commands
    // ============================================================
    
    // 4a: Handle $\text{...}$ pattern
    cleaned = cleaned.replace(
        /\$\s*\\text\{([^}]*?)\}\s*\$(\s*)/g,
        function(match, content, trailing) {
            // Clean up the content
            content = content.replace(/\\%/g, '%');
            content = content.replace(/\\&/g, '&');
            content = content.replace(/\\\$/g, '$');
            content = content.replace(/\\#/g, '#');
            content = content.replace(/\\_/g, '_');
            content = content.replace(/\\to\s*/g, '→ ');
            content = content.replace(/\\rightarrow\s*/g, '→ ');
            content = content.replace(/\\Rightarrow\s*/g, '⇒ ');
            return content + (trailing || '');
        }
    );
    
    // 4b: Handle standalone \text{...} (without $)
    cleaned = cleaned.replace(
        /\\text\{([^}]*?)\}/g,
        function(match, content) {
            content = content.replace(/\\%/g, '%');
            content = content.replace(/\\&/g, '&');
            content = content.replace(/\\\$/g, '$');
            content = content.replace(/\\#/g, '#');
            content = content.replace(/\\_/g, '_');
            return content;
        }
    );
    
    // ============================================================
    // STEP 5: Handle bullet list items
    // ============================================================
    
    // 5a: Convert * to • for all bullet points
    cleaned = cleaned.replace(/^\s*\*\s*/gm, '• ');
    
    // 5b: Convert - to • for bullet points
    cleaned = cleaned.replace(/^\s*-\s*/gm, '• ');
    
    // 5c: Clean up double bullets
    cleaned = cleaned.replace(/•\s*•/g, '•');
    
    // ============================================================
    // STEP 6: Handle special mathematical symbols
    // ============================================================
    
    // These cover most of the symbols used in the text
    cleaned = cleaned.replace(/\\propto/g, '∝');
    cleaned = cleaned.replace(/\\to\s*/g, '→ ');
    cleaned = cleaned.replace(/\\rightarrow\s*/g, '→ ');
    cleaned = cleaned.replace(/\\Rightarrow\s*/g, '⇒ ');
    cleaned = cleaned.replace(/\\approx/g, '≈');
    cleaned = cleaned.replace(/\\leq/g, '≤');
    cleaned = cleaned.replace(/\\geq/g, '≥');
    cleaned = cleaned.replace(/\\infty/g, '∞');
    cleaned = cleaned.replace(/\\neq/g, '≠');
    cleaned = cleaned.replace(/\\cdot/g, '·');
    cleaned = cleaned.replace(/\\times/g, '×');
    cleaned = cleaned.replace(/\\div/g, '÷');
    
    // ============================================================
    // STEP 7: Handle fractions and subscripts
    // ============================================================
    
    // 7a: Convert \frac{num}{den} to num/den
    cleaned = cleaned.replace(
        /\\frac\{([^}]*?)\}\{([^}]*?)\}/g,
        function(match, num, den) {
            return num + '/' + den;
        }
    );
    
    // 7b: Handle corrupted \text{frac}{...}{...}
    cleaned = cleaned.replace(
        /\\text\{frac\}\{([^}]*?)\}\{([^}]*?)\}/g,
        function(match, num, den) {
            return num + '/' + den;
        }
    );
    
    // 7c: Convert _{text} to <sub>text</sub>
    cleaned = cleaned.replace(
        /_\{([^}]*?)\}/g,
        function(match, content) {
            // If the content has math symbols, we leave it as text
            content = content.replace(/\\/g, '');
            return '<sub>' + content + '</sub>';
        }
    );
    
    // 7d: Convert ^{text} to <sup>text</sup>
    cleaned = cleaned.replace(
        /\^\{([^}]*?)\}/g,
        function(match, content) {
            content = content.replace(/\\/g, '');
            return '<sup>' + content + '</sup>';
        }
    );
    
    // 7e: Handle simple _{text} without braces
    cleaned = cleaned.replace(
        /_([a-zA-Z])/g,
        '<sub>$1</sub>'
    );
    
    // 7f: Handle simple ^{text} without braces
    cleaned = cleaned.replace(
        /\^([a-zA-Z])/g,
        '<sup>$1</sup>'
    );
    
    // ============================================================
    // STEP 8: Handle percentage signs
    // ============================================================
    
    // 8a: Convert \% to %
    cleaned = cleaned.replace(/\\%/g, '%');
    
    // 8b: Fix percentage spacing (e.g., "50 %" → "50%")
    cleaned = cleaned.replace(/(\d+)\s*%/g, '$1%');
    cleaned = cleaned.replace(/(\d+)%\s*([A-Za-z])/g, '$1% $2');
    cleaned = cleaned.replace(/(\d+)\s*%([A-Za-z])/g, '$1% $2');
    
    // ============================================================
    // STEP 9: Handle Rupee currency symbols
    // ============================================================
    
    // 9a: Fix Rupee with spaces
    cleaned = cleaned.replace(/₹\s*([\d\.\+]+)/g, '₹$1');
    cleaned = cleaned.replace(/₹([\d\.\+]+)\s*([A-Za-z])/g, '₹$1 $2');
    
    // ============================================================
    // STEP 10: Fix spacing and punctuation
    // ============================================================
    
    // 10a: Fix missing spaces after periods
    cleaned = cleaned.replace(/\.([A-Z])/g, '. $1');
    
    // 10b: Fix missing spaces after commas
    cleaned = cleaned.replace(/,([A-Za-z])/g, ', $1');
    
    // 10c: Fix missing spaces after colons
    cleaned = cleaned.replace(/:([A-Za-z])/g, ': $1');
    
    // 10d: Remove double spaces
    cleaned = cleaned.replace(/\s{2,}/g, ' ');
    
    // 10e: Fix missing spaces between words
    cleaned = cleaned.replace(/([a-z])([A-Z])/g, '$1 $2');
    
    // 10f: Clean up arrow spacing
    cleaned = cleaned.replace(/→\s*→/g, '→');
    cleaned = cleaned.replace(/⇒\s*⇒/g, '⇒');
    cleaned = cleaned.replace(/\s*→\s*/g, ' → ');
    cleaned = cleaned.replace(/\s*⇒\s*/g, ' ⇒ ');
    
    // ============================================================
    // STEP 11: Clean up remaining LaTeX artifacts
    // ============================================================
    
    // 11a: Remove any remaining backslashes that aren't needed
    cleaned = cleaned.replace(/\\/g, '');
    
    // 11b: Remove any remaining $ symbols
    cleaned = cleaned.replace(/\$/g, '');
    
    // 11c: Remove extra spaces around punctuation
    cleaned = cleaned.replace(/\s+\./g, '.');
    cleaned = cleaned.replace(/\s+,/g, ',');
    cleaned = cleaned.replace(/\s+:/g, ':');
    
    // ============================================================
    // STEP 12: Handle headers properly
    // ============================================================
    
    // 12a: Fix headers with missing spacing
    cleaned = cleaned.replace(/^(##+)\s*/gm, function(match, hashes) {
        const content = match.replace(hashes, '').trim();
        return '\n' + hashes + ' ' + content + '\n';
    });
    
    // 12b: Fix broken headers like "##2" -> "## 2"
    cleaned = cleaned.replace(/^(##+)(\d+)/gm, '$1 $2');
    
    // ============================================================
    // STEP 13: Final cleanup
    // ============================================================
    
    // 13a: Remove extra blank lines
    cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
    
    // 13b: Trim leading/trailing whitespace
    cleaned = cleaned.trim();
    
    // 13c: Ensure single spaces after bullet points
    cleaned = cleaned.replace(/•\s+/g, '• ');
    
    return cleaned;
}

 
    async function loadAndRenderDocument() {
        logDebug("Script execution started.", "info");

        const renderArea = document.getElementById('documentRenderArea');
        const metaConsole = document.getElementById('metaConsole');

        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file') || 'published/latest_report.md';

        logDebug(`Target File Path: '${filePath}'`, "info");

        try {
            logDebug(`Fetching '${filePath}'...`, "info");
            const response = await fetch(filePath);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }

            let markdownText = await response.text();
            logDebug(`Received file (${markdownText.length} bytes).`, "success");

            const fileName = filePath.split('/').pop();
            // Remove .md extension for display
            const displayName = fileName.replace('.md', '');
            metaConsole.innerHTML = `
                <span class="meta-badge">📄 ${displayName}</span>
                <span class="meta-badge">📅 ${displayName.split('_')[0] || 'Unknown date'}</span>
                <span class="meta-badge">⚡ ${markdownText.length} bytes</span>
            `;

            logDebug("Sanitizing LaTeX...", "info");
            markdownText = sanitizeLatexForKaTeX(markdownText);

            logDebug("Parsing Markdown with Marked.js...", "info");
            if (typeof marked !== 'undefined') {
                renderArea.innerHTML = marked.parse(markdownText);
            } else {
                renderArea.innerText = markdownText;
                logDebug("Marked.js CDN failed to load; rendering raw text.", "warn");
            }

            // Render Mermaid
            if (typeof mermaid !== 'undefined') {
                const codeBlocks = renderArea.querySelectorAll('pre code.language-mermaid');
                codeBlocks.forEach((block) => {
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = block.textContent;
                    block.parentElement.replaceWith(mermaidDiv);
                });
                const mermaidNodes = renderArea.querySelectorAll('.mermaid');
                if (mermaidNodes.length > 0) {
                    try { await mermaid.run({ nodes: mermaidNodes }); } catch(e) {}
                }
            }

            // Render KaTeX
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(renderArea, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }

            logDebug("Render pipeline complete!", "success");

        } catch (err) {
            logDebug(`ERROR: ${err.message}`, "error");
            renderArea.innerHTML = `
                <div style="color:#f87171; padding:20px; border:1px solid #f87171; border-radius:8px;">
                    <h3>❌ Unable to load document</h3>
                    <p><b>Path attempted:</b> <code>${filePath}</code></p>
                    <p><b>Error:</b> ${err.message}</p>
                </div>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        applySavedTheme();
        loadAndRenderDocument();
    });
</script>
</body>
