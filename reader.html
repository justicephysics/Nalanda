<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Core Reader</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent: #66fcf1;
            --border-color: #2e3c4e;
            --badge-bg: #151c24;
        }

        body.light-theme {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --accent: #0284c7;
            --border-color: #e2e8f0;
            --badge-bg: #edf2f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            padding: 20px;
            max-width: 920px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn, .theme-btn {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .meta-console {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }

        .meta-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--accent);
            font-weight: 600;
            font-family: monospace;
        }

        .debug-panel {
            background: #05080c;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #00ff66;
            max-height: 250px;
            overflow-y: auto;
        }

        .debug-log-entry { margin: 3px 0; word-break: break-all; }
        .debug-log-entry.info { color: #38bdf8; }
        .debug-log-entry.success { color: #4ade80; }
        .debug-log-entry.warn { color: #facc15; }
        .debug-log-entry.error { color: #f87171; font-weight: bold; }

        .content-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1, h2, h3 { color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; display: block; overflow-x: auto; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: left; }
    </style>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="back-btn">← Portal Index</a>
    <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">🌙 Night Mode</button>
</div>

<div class="meta-console" id="metaConsole">
    <span>⏳ Initializing Reader...</span>
</div>

    <div style="color:#ffffff; font-weight:bold; margin-bottom:8px; border-bottom:1px dashed #334155; padding-bottom:4px;">
        🔍 EXECUTION CONSOLE
    </div>
    <div id="debugLogs"></div>
</div>

<div class="content-card" id="documentRenderArea">
    <p>⏳ Waiting for document pipeline...</p>
</div>

<!-- Load CDN scripts dynamically at bottom with fallback error handlers -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

<script>
    function logDebug(message, type = 'info') {
        const logsDiv = document.getElementById('debugLogs');
        const timestamp = new Date().toLocaleTimeString();
        const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warn' ? '⚠️' : 'ℹ️';
        
        const entry = document.createElement('div');
        entry.className = `debug-log-entry ${type}`;
        entry.textContent = `[${timestamp}] ${icon} ${message}`;
        if (logsDiv) {
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
    }

    function applySavedTheme() {
        const savedTheme = localStorage.getItem('nalanda_theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
        }
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('nalanda_theme', isLight ? 'light' : 'dark');
        window.location.reload();
    }
    
    function sanitizeLatexForKaTeX(rawText) {
        if (!rawText) return '';
        let cleaned = rawText;
        
        // ============================================================
        // STEP 1: Basic cleanup
        // ============================================================
        cleaned = cleaned.replace(/\t/g, ' ');
        cleaned = cleaned.replace(/\r\n/g, '\n');
        cleaned = cleaned.replace(/\r/g, '\n');
        
        // ============================================================
        // STEP 2: Fix Gemini corruption patterns
        // ============================================================
        cleaned = cleaned.replaceAll('\\t$\\ttext', '\\text');
        cleaned = cleaned.replaceAll('$\\ttext', '\\text');
        cleaned = cleaned.replaceAll('\\t\\text', '\\text');
        cleaned = cleaned.replaceAll('\\t$', '');
        cleaned = cleaned.replaceAll('\\#\\#', '##'); // Fix broken headers
        cleaned = cleaned.replaceAll('\\#', '#');      // Fix broken headers
        
        // ============================================================
        // STEP 3: Handle bullet list items (the main problem area)
        // ============================================================
        
        // 3a: Convert * $\text{...}$ pattern to plain text bullet
        cleaned = cleaned.replace(
            /^\s*\*\s*\$\s*\\text\{([^}]*?)\}\s*\$(\s*)/gm,
            function(match, content, trailing) {
                // Decode the content
                content = content.replace(/\\%/g, '%');
                content = content.replace(/\\&/g, '&');
                content = content.replace(/\\\$/g, '$');
                content = content.replace(/\\#/g, '#');
                content = content.replace(/\\_/g, '_');
                content = content.replace(/\\~/g, '~');
                content = content.replace(/\\{/g, '{');
                content = content.replace(/\\}/g, '}');
                // Remove any trailing arrow artifacts
                content = content.replace(/\s*\\rightarrow\s*$/, '');
                content = content.replace(/\s*\\Rightarrow\s*$/, '');
                // Convert \to to arrow
                content = content.replace(/\\to\s*/g, '→ ');
                // Convert \rightarrow to arrow
                content = content.replace(/\\rightarrow\s*/g, '→ ');
                // Convert \Rightarrow to double arrow
                content = content.replace(/\\Rightarrow\s*/g, '⇒ ');
                // Clean up extra spaces
                content = content.replace(/\s{2,}/g, ' ');
                return '• ' + content + (trailing || '');
            }
        );
        
        // 3b: Convert * $\text{...} \rightarrow \text{...} \Rightarrow \text{...}$ pattern
        cleaned = cleaned.replace(
            /^\s*\*\s*\$\s*\\text\{([^}]*?)\}\s*\\rightarrow\s*\\text\{([^}]*?)\}\s*\\Rightarrow\s*\\text\{([^}]*?)\}\s*\$(\s*)/gm,
            function(match, part1, part2, part3, trailing) {
                part1 = part1.replace(/\\%/g, '%').replace(/\\&/g, '&');
                part2 = part2.replace(/\\%/g, '%').replace(/\\&/g, '&');
                part3 = part3.replace(/\\%/g, '%').replace(/\\&/g, '&');
                return '• ' + part1 + ' → ' + part2 + ' ⇒ ' + part3 + (trailing || '');
            }
        );
        
        // 3c: Convert * $\text{...} \rightarrow \text{...}$ pattern (simple case)
        cleaned = cleaned.replace(
            /^\s*\*\s*\$\s*\\text\{([^}]*?)\}\s*\\rightarrow\s*\\text\{([^}]*?)\}\s*\$(\s*)/gm,
            function(match, part1, part2, trailing) {
                part1 = part1.replace(/\\%/g, '%').replace(/\\&/g, '&');
                part2 = part2.replace(/\\%/g, '%').replace(/\\&/g, '&');
                return '• ' + part1 + ' → ' + part2 + (trailing || '');
            }
        );
        
        // 3d: Convert standalone * \text{...} (without $)
        cleaned = cleaned.replace(
            /^\s*\*\s*\\text\{([^}]*?)\}(\s*)/gm,
            function(match, content, trailing) {
                content = content.replace(/\\%/g, '%').replace(/\\&/g, '&');
                content = content.replace(/\\\$/g, '$').replace(/\\#/g, '#');
                content = content.replace(/\\_/g, '_');
                content = content.replace(/\\to\s*/g, '→ ');
                content = content.replace(/\\rightarrow\s*/g, '→ ');
                content = content.replace(/\\Rightarrow\s*/g, '⇒ ');
                return '• ' + content + (trailing || '');
            }
        );
        
        // 3e: Convert plain * with no LaTeX
        cleaned = cleaned.replace(/^\s*\*\s*/gm, '• ');
        
        // ============================================================
        // STEP 4: Handle inline \text{...} that are NOT in bullet lists
        // ============================================================
        
        // 4a: Convert $\text{...}$ to plain text (inline)
        cleaned = cleaned.replace(
            /\$\s*\\text\{([^}]*?)\}\s*\$(\s*)/g,
            function(match, content, trailing) {
                content = content.replace(/\\%/g, '%');
                content = content.replace(/\\&/g, '&');
                content = content.replace(/\\\$/g, '$');
                content = content.replace(/\\#/g, '#');
                content = content.replace(/\\_/g, '_');
                content = content.replace(/\\to\s*/g, '→ ');
                content = content.replace(/\\rightarrow\s*/g, '→ ');
                content = content.replace(/\\Rightarrow\s*/g, '⇒ ');
                return content + (trailing || ' ');
            }
        );
        
        // 4b: Convert standalone \text{...} (no $)
        cleaned = cleaned.replace(
            /\\text\{([^}]*?)\}/g,
            function(match, content) {
                content = content.replace(/\\%/g, '%');
                content = content.replace(/\\&/g, '&');
                content = content.replace(/\\\$/g, '$');
                content = content.replace(/\\#/g, '#');
                content = content.replace(/\\_/g, '_');
                return content;
            }
        );
        
        // ============================================================
        // STEP 5: Handle special mathematical symbols and patterns
        // ============================================================
        
        // 5a: Convert \propto to ∝
        cleaned = cleaned.replace(/\\propto/g, '∝');
        
        // 5b: Convert \to to →
        cleaned = cleaned.replace(/\\to\s*/g, '→ ');
        
        // 5c: Convert \rightarrow to →
        cleaned = cleaned.replace(/\\rightarrow\s*/g, '→ ');
        
        // 5d: Convert \Rightarrow to ⇒
        cleaned = cleaned.replace(/\\Rightarrow\s*/g, '⇒ ');
        
        // 5e: Convert \approx to ≈
        cleaned = cleaned.replace(/\\approx/g, '≈');
        
        // 5f: Convert \leq to ≤
        cleaned = cleaned.replace(/\\leq/g, '≤');
        
        // 5g: Convert \geq to ≥
        cleaned = cleaned.replace(/\\geq/g, '≥');
        
        // 5h: Convert \infty to ∞
        cleaned = cleaned.replace(/\\infty/g, '∞');
        
        // 5i: Convert \neq to ≠
        cleaned = cleaned.replace(/\\neq/g, '≠');
        
        // ============================================================
        // STEP 6: Handle subscript/superscript patterns
        // ============================================================
        
        // 6a: Convert _{text} to <sub>text</sub>
        cleaned = cleaned.replace(
            /_\{([^}]*?)\}/g,
            function(match, content) {
                // If content contains math, keep it as LaTeX
                if (content.includes('\\') || content.includes('^')) {
                    return match;
                }
                return '<sub>' + content + '</sub>';
            }
        );
        
        // 6b: Convert ^{text} to <sup>text</sup>
        cleaned = cleaned.replace(
            /\^\{([^}]*?)\}/g,
            function(match, content) {
                // If content contains math, keep it as LaTeX
                if (content.includes('\\') || content.includes('^')) {
                    return match;
                }
                return '<sup>' + content + '</sup>';
            }
        );
        
        // ============================================================
        // STEP 7: Clean up mathematical expressions that should remain as LaTeX
        // ============================================================
        
        // 7a: Keep \frac{...}{...} as math (for KaTeX)
        // 7b: Keep \sum, \int, \sqrt as math
        // 7c: Keep \[...\] and $$...$$ as math
        
        // These are already preserved by KaTeX's delimiters
        
        // ============================================================
        // STEP 8: Final cleanup of punctuation and spacing
        // ============================================================
        
        // 8a: Fix missing spaces after periods
        cleaned = cleaned.replace(/\.([A-Z])/g, '. $1');
        
        // 8b: Fix missing spaces after commas
        cleaned = cleaned.replace(/,([A-Za-z])/g, ', $1');
        
        // 8c: Fix missing spaces after colons
        cleaned = cleaned.replace(/:([A-Za-z])/g, ': $1');
        
        // 8d: Remove double spaces
        cleaned = cleaned.replace(/\s{2,}/g, ' ');
        
        // 8e: Fix missing spaces between words
        cleaned = cleaned.replace(/([a-z])([A-Z])/g, '$1 $2');
        
        // 8f: Clean up arrow spacing
        cleaned = cleaned.replace(/→\s*→/g, '→');
        cleaned = cleaned.replace(/⇒\s*⇒/g, '⇒');
        
        // 8g: Fix percentage signs
        cleaned = cleaned.replace(/(\d+)\s*%/g, '$1%');
        cleaned = cleaned.replace(/(\d+)%\s*([A-Za-z])/g, '$1% $2');
        
        // ============================================================
        // STEP 9: Handle Rupee currency symbols
        // ============================================================
        
        // 9a: Fix Rupee with spaces
        cleaned = cleaned.replace(/₹\s*([\d\.\+]+)/g, '₹$1');
        cleaned = cleaned.replace(/₹([\d\.\+]+)\s*([A-Za-z])/g, '₹$1 $2');
        
        // ============================================================
        // STEP 10: Clean up remaining math delimiters
        // ============================================================
        
        // 10a: Remove single $ that are not part of math
        // Only remove $ that appear at the start of a line or after a space
        cleaned = cleaned.replace(/^\s*\$(\s*[A-Za-z])/gm, '$1');
        cleaned = cleaned.replace(/\s\$(\s*[A-Za-z])/g, ' $1');
        
        // 10b: Remove any stray \text{} that might remain
        cleaned = cleaned.replace(/\\text\{([^}]*?)\}/g, '$1');
        
        // ============================================================
        // STEP 11: Format headers properly
        // ============================================================
        
        // 11a: Ensure headers have proper spacing
        cleaned = cleaned.replace(/^(##+)\s*/gm, function(match, hashes) {
            const level = hashes.length;
            const content = match.replace(hashes, '').trim();
            return '\n' + hashes + ' ' + content + '\n';
        });
        
        // ============================================================
        // STEP 12: Final cleanup
        // ============================================================
        
        // 12a: Remove extra blank lines
        cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
        
        // 12b: Trim leading/trailing whitespace
        cleaned = cleaned.trim();
        
        return cleaned;
    }
 
    async function loadAndRenderDocument() {
        logDebug("Script execution started.", "info");

        const renderArea = document.getElementById('documentRenderArea');
        const metaConsole = document.getElementById('metaConsole');

        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file') || 'published/latest_report.md';

        logDebug(`Target File Path: '${filePath}'`, "info");

        try {
            logDebug(`Fetching '${filePath}'...`, "info");
            const response = await fetch(filePath);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }

            let markdownText = await response.text();
            logDebug(`Received file (${markdownText.length} bytes).`, "success");

            const fileName = filePath.split('/').pop();
            // Remove .md extension for display
            const displayName = fileName.replace('.md', '');
            metaConsole.innerHTML = `
                <span class="meta-badge">📄 ${displayName}</span>
                <span class="meta-badge">📅 ${displayName.split('_')[0] || 'Unknown date'}</span>
                <span class="meta-badge">⚡ ${markdownText.length} bytes</span>
            `;

            logDebug("Sanitizing LaTeX...", "info");
            markdownText = sanitizeLatexForKaTeX(markdownText);

            logDebug("Parsing Markdown with Marked.js...", "info");
            if (typeof marked !== 'undefined') {
                renderArea.innerHTML = marked.parse(markdownText);
            } else {
                renderArea.innerText = markdownText;
                logDebug("Marked.js CDN failed to load; rendering raw text.", "warn");
            }

            // Render Mermaid
            if (typeof mermaid !== 'undefined') {
                const codeBlocks = renderArea.querySelectorAll('pre code.language-mermaid');
                codeBlocks.forEach((block) => {
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = block.textContent;
                    block.parentElement.replaceWith(mermaidDiv);
                });
                const mermaidNodes = renderArea.querySelectorAll('.mermaid');
                if (mermaidNodes.length > 0) {
                    try { await mermaid.run({ nodes: mermaidNodes }); } catch(e) {}
                }
            }

            // Render KaTeX
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(renderArea, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }

            logDebug("Render pipeline complete!", "success");

        } catch (err) {
            logDebug(`ERROR: ${err.message}`, "error");
            renderArea.innerHTML = `
                <div style="color:#f87171; padding:20px; border:1px solid #f87171; border-radius:8px;">
                    <h3>❌ Unable to load document</h3>
                    <p><b>Path attempted:</b> <code>${filePath}</code></p>
                    <p><b>Error:</b> ${err.message}</p>
                </div>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        applySavedTheme();
        loadAndRenderDocument();
    });
</script>
</body>
</html>
