<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Core Reader</title>

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX CSS & JS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Mermaid.js for Diagram Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --text-bright: #ffffff;
            --accent: #66fcf1;
            --border-color: #2e3c4e;
            --code-bg: #0b0c10;
            --table-header-bg: #151c24;
        }

        body.light-theme {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-bright: #1a202c;
            --accent: #0284c7;
            --border-color: #e2e8f0;
            --code-bg: #f8fafc;
            --table-header-bg: #edf2f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            padding: 20px;
            max-width: 920px;
            margin: 0 auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn, .theme-btn {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover, .theme-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
        }

        .content-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        h1, h2, h3, h4 { 
            color: var(--accent); 
            line-height: 1.3;
        }

        ul, ol {
            padding-left: 24px;
            margin: 12px 0;
        }

        li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        li > p {
            display: inline;
            margin: 0;
        }

        li .katex-display {
            display: block;
            margin: 6px 0 !important;
        }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 0;
            margin: 12px 0 !important;
            max-width: 100%;
        }

        blockquote {
            background: var(--code-bg);
            border-left: 4px solid var(--accent);
            margin: 20px 0;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            display: block;
            overflow-x: auto;
            max-width: 100%;
            background: var(--code-bg);
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th { 
            background: var(--table-header-bg); 
            color: var(--accent); 
        }

        .mermaid {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            overflow-x: auto;
        }

        code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="back-btn">
        ← Back to Main Portal (All 8 Disciplines)
    </a>

    <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">
        🌙 Night Mode
    </button>
</div>

<div class="content-card" id="documentRenderArea">
    <p>⏳ Loading master document...</p>
</div>

<script>
    function applySavedTheme() {
        const savedTheme = localStorage.getItem('nalanda_theme') || 'dark';
        const toggleBtn = document.getElementById('themeToggleBtn');
        
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            toggleBtn.innerHTML = '☀️ Day Mode';
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
        } else {
            document.body.classList.remove('light-theme');
            toggleBtn.innerHTML = '🌙 Night Mode';
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        }
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('nalanda_theme', isLight ? 'light' : 'dark');
        window.location.reload();
    }

    /**
     * DETERMINISTIC MULTI-PASS LATEX SANITIZER (JS EQUIVALENT)
     */
    function sanitizeLatexForKaTeX(rawText) {
        if (!rawText) return '';
        let cleaned = rawText;

        // 1. Strip literal ASCII tabs
        cleaned = cleaned.replace(/\t/g, ' ');

        // 2. Replace hard corruption sequences
        cleaned = cleaned.replaceAll('\\t$\\ttext', '\\text');
        cleaned = cleaned.replaceAll('$\\ttext', '\\text');
        cleaned = cleaned.replaceAll('\\t\\text', '\\text');
        cleaned = cleaned.replaceAll('\\t$', '');

        // 3. Clean stray $ attached to \text{} before _, ^, or }
        cleaned = cleaned.replace(/(\\text\{[^}]+\})\$([_\^}])/g, '$1$2');

        // 4. Clean stray $ before \text{} in subscripts
        cleaned = cleaned.replace(/(_|\^)\{\s*\$+\s*(\\text\{[^}]+\})\s*\}/g, '$1{$2}');
        cleaned = cleaned.replace(/(_|\^)\{\s*\$+\s*(\\text\{[^}]+\})\s*\$+\s*\}/g, '$1{$2}');

        // 5. Fix mismatched display math bounds ($...$$ -> $$...$$)
        cleaned = cleaned.replace(/^\$(\s*\\text\{[\s\S]*?)\$\$$/gm, '$$\\1$$');

        // 6. Fix Rupee currency collisions
        cleaned = cleaned.replace(/₹\$\s*([\d\.\+]+)\s*\\text\{([^}]+)\}/g, '₹$1 $2');
        cleaned = cleaned.replace(/₹\$\s*([\d\.\+]+)/g, '₹$1');

        // 7. Fix list bullet formatting
        cleaned = cleaned.replace(/^(\s*\*)\s*\\text\{/gm, '$1 $\\text{');

        // 8. Clean ampersands inside \text{}
        cleaned = cleaned.replace(/\\text\{([^}]*)\}/g, function(match, innerText) {
            let sanitized = innerText.replace(/\\&/g, 'and').replace(/&/g, 'and');
            return '\\text{' + sanitized + '}';
        });

        return cleaned;
    }

    async function loadAndRenderDocument() {
        applySavedTheme();
        const renderArea = document.getElementById('documentRenderArea');
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file') || 'staged_outputs/latest_report.md';

        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error("Document not found at path: " + filePath);
            
            let markdownText = await response.text();

            // Run Multi-Pass Sanitizer
            markdownText = sanitizeLatexForKaTeX(markdownText);

            // Parse Markdown to HTML
            renderArea.innerHTML = marked.parse(markdownText);

            // Transform Mermaid code blocks
            const codeBlocks = renderArea.querySelectorAll('pre code.language-mermaid');
            codeBlocks.forEach((block) => {
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                let rawCode = block.textContent || block.innerText;
                rawCode = rawCode.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                mermaidDiv.textContent = rawCode;
                block.parentElement.replaceWith(mermaidDiv);
            });

            // Safely Render Mermaid Diagrams
            const mermaidNodes = renderArea.querySelectorAll('.mermaid');
            for (const node of mermaidNodes) {
                try {
                    await mermaid.run({ nodes: [node] });
                } catch (diagramErr) {
                    node.innerHTML = `<pre style="color:#ef9a9a; font-size:12px; text-align:left; background:#0b0c10; padding:12px; border-radius:6px;">⚠️ Diagram Render Fallback:\n${node.textContent}</pre>`;
                }
            }

            // Safely Render KaTeX Math
            if (window.renderMathInElement) {
                renderMathInElement(renderArea, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false,
                    errorColor: '#ef9a9a'
                });
            }
        } catch (err) {
            renderArea.innerHTML = `<h3 style="color:#ef9a9a;">❌ Render Failure</h3><p>${err.message}</p>`;
        }
    }

    window.addEventListener('DOMContentLoaded', loadAndRenderDocument);
</script>
</body>
</html>
