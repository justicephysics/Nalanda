<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Core Reader</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent: #66fcf1;
            --border-color: #2e3c4e;
            --badge-bg: #151c24;
        }

        body.light-theme {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --accent: #0284c7;
            --border-color: #e2e8f0;
            --badge-bg: #edf2f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            padding: 20px;
            max-width: 920px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn, .theme-btn {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .meta-console {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }

        .meta-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--accent);
            font-weight: 600;
            font-family: monospace;
        }

        .debug-panel {
            background: #05080c;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #00ff66;
            max-height: 250px;
            overflow-y: auto;
        }

        .debug-log-entry { margin: 3px 0; word-break: break-all; }
        .debug-log-entry.info { color: #38bdf8; }
        .debug-log-entry.success { color: #4ade80; }
        .debug-log-entry.warn { color: #facc15; }
        .debug-log-entry.error { color: #f87171; font-weight: bold; }

        .content-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1, h2, h3 { color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; display: block; overflow-x: auto; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: left; }
    </style>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="back-btn">← Portal Index</a>
    <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">🌙 Night Mode</button>
</div>

<div class="meta-console" id="metaConsole">
    <span>⏳ Initializing Reader...</span>
</div>

<!-- <div class="debug-panel" id="debugPanel">
    <div style="color:#ffffff; font-weight:bold; margin-bottom:8px; border-bottom:1px dashed #334155; padding-bottom:4px;">
        🔍 EXECUTION CONSOLE
    </div>
    <div id="debugLogs"></div>
</div>
-->
<div class="content-card" id="documentRenderArea">
    <p>⏳ Waiting for document pipeline...</p>
</div>

<!-- Load CDN scripts dynamically at bottom with fallback error handlers -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

<script>
    function logDebug(message, type = 'info') {
        const logsDiv = document.getElementById('debugLogs');
        const timestamp = new Date().toLocaleTimeString();
        const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warn' ? '⚠️' : 'ℹ️';
        
        const entry = document.createElement('div');
        entry.className = `debug-log-entry ${type}`;
        entry.textContent = `[${timestamp}] ${icon} ${message}`;
        if (logsDiv) {
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
    }

    function applySavedTheme() {
        const savedTheme = localStorage.getItem('nalanda_theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
        }
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('nalanda_theme', isLight ? 'light' : 'dark');
        window.location.reload();
    }

    function sanitizeLatexForKaTeX(rawText) {
    if (!rawText) return '';
    let cleaned = rawText;
    
    // ============================================================
    // STEP 1: Basic cleanup
    // ============================================================
    cleaned = cleaned.replace(/\t/g, ' ');
    
    // ============================================================
    // STEP 2: Fix corruption patterns (from Gemini)
    // ============================================================
    cleaned = cleaned.replaceAll('\\t$\\ttext', '\\text');
    cleaned = cleaned.replaceAll('$\\ttext', '\\text');
    cleaned = cleaned.replaceAll('\\t\\text', '\\text');
    cleaned = cleaned.replaceAll('\\t$', '');
    
    // ============================================================
    // STEP 3: Convert \text{...} with arrows to plain text
    // ============================================================
    // Pattern: $\text{Text } \rightarrow \text{ More Text } \Rightarrow \text{ Final }$
    // Convert to: Text → More Text ⇒ Final
    
    // First, handle the common pattern: \text{A} \rightarrow \text{B} \Rightarrow \text{C}
    cleaned = cleaned.replace(
        /\$\s*\\text\{([^}]*?)\}\s*\\rightarrow\s*\\text\{([^}]*?)\}\s*\\Rightarrow\s*\\text\{([^}]*?)\}\s*\$(\s*)/g,
        '$1 → $2 ⇒ $3'
    );
    
    // Handle: \text{A} \rightarrow \text{B} \Rightarrow (with trailing text)
    cleaned = cleaned.replace(
        /\$\s*\\text\{([^}]*?)\}\s*\\rightarrow\s*\\text\{([^}]*?)\}\s*\\Rightarrow\s*(.*?)\s*\$(\s*)/g,
        '$1 → $2 ⇒ $3'
    );
    
    // Handle: \text{A} \rightarrow \text{B} (simple case)
    cleaned = cleaned.replace(
        /\$\s*\\text\{([^}]*?)\}\s*\\rightarrow\s*\\text\{([^}]*?)\}\s*\$(\s*)/g,
        '$1 → $2'
    );
    
    // ============================================================
    // STEP 4: Convert \text{...} with plain text (no math) to plain text
    // ============================================================
    // Pattern: $\text{Some text with % and symbols}$
    // Convert to: Some text with % and symbols
    
    // This handles text with percentages, numbers, commas, etc.
    cleaned = cleaned.replace(
        /\$\s*\\text\{([^}]*?)\}\s*\$(\s*)/g,
        function(match, content, trailing) {
            // Remove escaping from \% (convert to plain %)
            content = content.replace(/\\%/g, '%');
            // Remove escaping from \& (convert to plain &)
            content = content.replace(/\\&/g, '&');
            // Remove escaping from \$ (convert to plain $)
            content = content.replace(/\\\$/g, '$');
            // Remove escaping from \# (convert to plain #)
            content = content.replace(/\\#/g, '#');
            // Remove escaping from \_ (convert to plain _)
            content = content.replace(/\\_/g, '_');
            return content + (trailing || ' ');
        }
    );
    
    // ============================================================
    // STEP 5: Handle special patterns
    // ============================================================
    
    // 5a: Handle standalone \text{...} with percentages in bullet lists
    cleaned = cleaned.replace(
        /^(\s*\*\s*)\$\s*\\text\{([^}]*?)\}\s*\$(\s*)/gm,
        function(match, bullet, content, trailing) {
            content = content.replace(/\\%/g, '%');
            content = content.replace(/\\&/g, '&');
            content = content.replace(/\\\$/g, '$');
            content = content.replace(/\\#/g, '#');
            content = content.replace(/\\_/g, '_');
            // Remove any trailing arrow or symbol from the content
            content = content.replace(/\s*\\rightarrow\s*$/, '');
            content = content.replace(/\s*\\Rightarrow\s*$/, '');
            return bullet + content + (trailing || '');
        }
    );
    
    // 5b: Handle the "L_{\\text{Gini}}" pattern
    cleaned = cleaned.replace(
        /\(L_\{\\text\{([^}]*?)\}\}\)\s*\\approx\s*([\d\.]+)/g,
        '(L<sub>$1</sub>) ≈ $2'
    );
    
    // 5c: Handle \frac{dS_{Civ.}}{dt} pattern
    cleaned = cleaned.replace(
        /\\frac\{dS_\{([^}]*?)\}\}\{dt\}/g,
        'dS<sub>$1</sub>/dt'
    );
    
    // 5d: Handle \propto
    cleaned = cleaned.replace(/\\propto/g, '∝');
    
    // 5e: Handle \to (arrow to)
    cleaned = cleaned.replace(/\\to\s*/g, '→ ');
    
    // 5f: Handle \rightarrow
    cleaned = cleaned.replace(/\\rightarrow\s*/g, '→ ');
    
    // 5g: Handle \Rightarrow
    cleaned = cleaned.replace(/\\Rightarrow\s*/g, '⇒ ');
    
    // ============================================================
    // STEP 6: Clean up any remaining math delimiters
    // ============================================================
    
    // 6a: Remove single dollar signs that are not part of math
    cleaned = cleaned.replace(/\$\s*([A-Za-z])/g, '$1');
    
    // 6b: Remove double dollar signs
    cleaned = cleaned.replace(/\$\$/g, '');
    
    // 6c: Remove any stray \text{} that might remain
    cleaned = cleaned.replace(/\\text\{([^}]*?)\}/g, '$1');
    
    // 6d: Clean up extra spaces
    cleaned = cleaned.replace(/\s{2,}/g, ' ');
    
    // ============================================================
    // STEP 7: Handle bullet list formatting
    // ============================================================
    // Ensure bullets are properly formatted with spaces
    cleaned = cleaned.replace(/^\s*\*\s*/gm, '• ');
    
    // ============================================================
    // STEP 8: Handle mathematical expressions that should stay
    // ============================================================
    // These are NOT converted - they stay as LaTeX for KaTeX
    
    // 8a: Keep \frac{...}{...} as math
    // 8b: Keep \sum, \int, \sqrt, etc. as math
    // 8c: Keep \approx, \leq, \geq, etc. as math
    
    // We'll let KaTeX handle these:
    // - \frac{dS_{Civ.}}{dt} \propto \frac{1}{\eta_{Edu}}
    // - (L_{\text{Gini}}) \approx 0.92
    
    // ============================================================
    // STEP 9: Final cleanup of bullet points
    // ============================================================
    // Fix any bullets that might have been broken
    cleaned = cleaned.replace(/•\s*•/g, '•');
    cleaned = cleaned.replace(/•\s*([a-zA-Z])/g, '• $1');
    
    return cleaned;
}

    async function loadAndRenderDocument() {
        logDebug("Script execution started.", "info");

        const renderArea = document.getElementById('documentRenderArea');
        const metaConsole = document.getElementById('metaConsole');

        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file') || 'published/latest_report.md';

        logDebug(`Target File Path: '${filePath}'`, "info");

        try {
            logDebug(`Fetching '${filePath}'...`, "info");
            const response = await fetch(filePath);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }

            let markdownText = await response.text();
            logDebug(`Received file (${markdownText.length} bytes).`, "success");

            const fileName = filePath.split('/').pop();
            // Remove .md extension for display
            const displayName = fileName.replace('.md', '');
            metaConsole.innerHTML = `
                <span class="meta-badge">📄 ${displayName}</span>
                <span class="meta-badge">📅 ${displayName.split('_')[0] || 'Unknown date'}</span>
                <span class="meta-badge">⚡ ${markdownText.length} bytes</span>
            `;

            logDebug("Sanitizing LaTeX...", "info");
            markdownText = sanitizeLatexForKaTeX(markdownText);

            logDebug("Parsing Markdown with Marked.js...", "info");
            if (typeof marked !== 'undefined') {
                renderArea.innerHTML = marked.parse(markdownText);
            } else {
                renderArea.innerText = markdownText;
                logDebug("Marked.js CDN failed to load; rendering raw text.", "warn");
            }

            // Render Mermaid
            if (typeof mermaid !== 'undefined') {
                const codeBlocks = renderArea.querySelectorAll('pre code.language-mermaid');
                codeBlocks.forEach((block) => {
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = block.textContent;
                    block.parentElement.replaceWith(mermaidDiv);
                });
                const mermaidNodes = renderArea.querySelectorAll('.mermaid');
                if (mermaidNodes.length > 0) {
                    try { await mermaid.run({ nodes: mermaidNodes }); } catch(e) {}
                }
            }

            // Render KaTeX
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(renderArea, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }

            logDebug("Render pipeline complete!", "success");

        } catch (err) {
            logDebug(`ERROR: ${err.message}`, "error");
            renderArea.innerHTML = `
                <div style="color:#f87171; padding:20px; border:1px solid #f87171; border-radius:8px;">
                    <h3>❌ Unable to load document</h3>
                    <p><b>Path attempted:</b> <code>${filePath}</code></p>
                    <p><b>Error:</b> ${err.message}</p>
                </div>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        applySavedTheme();
        loadAndRenderDocument();
    });
</script>
</body>
</html>
