<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Core Reader</title>

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX CSS & JS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Mermaid.js for Diagram Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.7;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .content-card {
            background: #1f2833;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2e3c4e;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1, h2, h3 { color: #66fcf1; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #0b0c10;
        }
        th, td {
            padding: 12px;
            border: 1px solid #45a29e;
            text-align: left;
        }
        th { background: #1f2833; color: #66fcf1; }
        .mermaid {
            background: #0b0c10;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="content-card" id="documentRenderArea">
    <p>⏳ Loading master document...</p>
</div>

<script>
    // Initialize Mermaid.js
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    function sanitizeLatexForKaTeX(rawText) {
        // Replaces & with 'and' inside \text{...} blocks to prevent KaTeX parse errors
        return rawText.replace(/\\text\{([^}]*)\}/g, function(match, innerText) {
            return '\\text{' + innerText.replace(/&/g, 'and') + '}';
        });
    }

    async function loadAndRenderDocument() {
        const renderArea = document.getElementById('documentRenderArea');
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file') || 'staged_outputs/latest_report.md';

        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error("Document not found at path: " + filePath);
            
            let markdownText = await response.text();

            // 1. Sanitize LaTeX ampersands programmatically before parsing
            markdownText = sanitizeLatexForKaTeX(markdownText);

            // 2. Convert Markdown to HTML
            renderArea.innerHTML = marked.parse(markdownText);

            // 3. Transform Mermaid code blocks into renderable divs
            const codeBlocks = renderArea.querySelectorAll('pre code.language-mermaid');
            codeBlocks.forEach((block) => {
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = block.textContent;
                block.parentElement.replaceWith(mermaidDiv);
            });

            // 4. Render Mermaid Diagrams
            if (renderArea.querySelectorAll('.mermaid').length > 0) {
                await mermaid.run({ nodes: renderArea.querySelectorAll('.mermaid') });
            }

            // 5. Render KaTeX Math (handling both $ inline $ and $$ display $$)
            if (window.renderMathInElement) {
                renderMathInElement(renderArea, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            }
        } catch (err) {
            renderArea.innerHTML = `<h3 style="color:#ef9a9a;">❌ Render Failure</h3><p>${err.message}</p>`;
        }
    }

    // Execute rendering on page load
    window.addEventListener('DOMContentLoaded', loadAndRenderDocument);
</script>
</body>
</html>
