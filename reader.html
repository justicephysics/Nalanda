<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Core Reader</title>

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX CSS & JS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Mermaid.js for Diagram Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <style>
        :root {
            /* Default Dark Mode Theme */
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --text-bright: #ffffff;
            --accent: #66fcf1;
            --border-color: #2e3c4e;
            --code-bg: #0b0c10;
            --table-header-bg: #151c24;
        }

        body.light-theme {
            /* Day Mode Theme */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-bright: #1a202c;
            --accent: #0284c7;
            --border-color: #e2e8f0;
            --code-bg: #f8fafc;
            --table-header-bg: #edf2f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.8;
            padding: 20px;
            max-width: 920px;
            margin: 0 auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn, .theme-btn {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover, .theme-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
        }

        .content-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: background-color 0.3s ease;
        }

        h1, h2, h3, h4 { 
            color: var(--accent); 
            line-height: 1.3;
        }

        blockquote {
            background: var(--code-bg);
            border-left: 4px solid var(--accent);
            margin: 20px 0;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        /* Strict Table and Math Boundary Overflow Fixes */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            display: block;
            overflow-x: auto;
            max-width: 100%;
            background: var(--code-bg);
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th { 
            background: var(--table-header-bg); 
            color: var(--accent); 
        }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 12px 0;
            max-width: 100%;
        }

        .mermaid {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            overflow-x: auto;
        }

        code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        pre code {
            padding: 15px;
            display: block;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <!-- Reverse Navigation to Main Portal / All Disciplines -->
    <a href="index.html" class="back-btn">
        ← Back to Main Portal (All 8 Disciplines)
    </a>

    <!-- Day / Night Toggle Button -->
    <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">
        🌙 Night Mode
    </button>
</div>

<div class="content-card" id="documentRenderArea">
    <p>⏳ Loading master document...</p>
</div>

<script>
    // Theme Switcher Logic
    function applySavedTheme() {
        const savedTheme = localStorage.getItem('nalanda_theme') || 'dark';
        const toggleBtn = document.getElementById('themeToggleBtn');
        
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            toggleBtn.innerHTML = '☀️ Day Mode';
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
        } else {
            document.body.classList.remove('light-theme');
            toggleBtn.innerHTML = '🌙 Night Mode';
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        }
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('nalanda_theme', isLight ? 'light' : 'dark');
        applySavedTheme();
        // Reload page to re-render Mermaid diagrams with proper contrast theme
        window.location.reload();
    }

    function sanitizeLatexForKaTeX(rawText) {
        // Fixes ampersand and backslash issues inside \text{...} blocks
        return rawText.replace(/\\text\{([^}]*)\}/g, function(match, innerText) {
            let cleaned = innerText.replace(/\\&/g, 'and').replace(/&/g, 'and');
            return '\\text{' + cleaned + '}';
        });
    }

    async function loadAndRenderDocument() {
        applySavedTheme();
        const renderArea = document.getElementById('documentRenderArea');
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file') || 'staged_outputs/latest_report.md';

        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error("Document not found at path: " + filePath);
            
            let markdownText = await response.text();

            // 1. Sanitize LaTeX strings
            markdownText = sanitizeLatexForKaTeX(markdownText);

            // 2. Parse Markdown to HTML
            renderArea.innerHTML = marked.parse(markdownText);

            // 3. Transform Mermaid blocks
            const codeBlocks = renderArea.querySelectorAll('pre code.language-mermaid');
            codeBlocks.forEach((block) => {
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = block.textContent;
                block.parentElement.replaceWith(mermaidDiv);
            });

            // 4. Render Diagrams
            if (renderArea.querySelectorAll('.mermaid').length > 0) {
                await mermaid.run({ nodes: renderArea.querySelectorAll('.mermaid') });
            }

            // 5. Render Math cleanly with boundary protection
            if (window.renderMathInElement) {
                renderMathInElement(renderArea, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            }
        } catch (err) {
            renderArea.innerHTML = `<h3 style="color:#ef9a9a;">❌ Render Failure</h3><p>${err.message}</p>`;
        }
    }

    window.addEventListener('DOMContentLoaded', loadAndRenderDocument);
</script>
</body>
</html>
