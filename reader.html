<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalanda Ledger Viewport</title>
    <!-- Core layout styling engines -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #0B0C10;
            color: #C5C6C7;
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.7;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .viewport-card {
            width: 100%;
            max-width: 850px;
            background: #11141a;
            border: 1px solid #2e3c4e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        a { color: #66FCF1; text-decoration: none; }
        a:hover { text-underline-offset: 4px; text-decoration: underline; }
        h1, h2, h3 { color: #FFFFFF; border-bottom: 1px solid #2e3c4e; padding-bottom: 8px; margin-top: 30px; }
        h1 { color: #66FCF1; }
        pre, code { font-family: monospace; background: #1f2833; color: #FFFFFF; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; border-left: 3px solid #66FCF1; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #2e3c4e; padding: 12px; text-align: left; }
        th { background: #1f2833; color: #66FCF1; }
        .back-nav { display: inline-block; margin-bottom: 30px; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>

<div class="viewport-card">
    <a href="index.html" class="back-nav"> ◄◄ Return to 8 Frontiers Directory Matrix</a>
    <div id="renderZone">📡 Establishing secure connection to ledger asset layers...</div>
</div>

<script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    async function loadAndCompileMarkdownAsset() {
        const urlParams = new URLSearchParams(window.location.search);
        const fileTarget = urlParams.get('file');
        const displayZone = document.getElementById('renderZone');

        if (!fileTarget) {
            displayZone.innerHTML = "❌ Error: System request parameters missing target asset path location.";
            return;
        }

        try {
            const response = await fetch(fileTarget);
            if (!response.ok) throw new Error("Asset missing from folder vault register.");
            let markdownText = await response.text();
            
            // Compile raw text to high-fidelity HTML layout structures
            displayZone.innerHTML = marked.parse(markdownText);
            
            // Re-fire visual engines to draw equations and diagrams cleanly
            await mermaid.run();
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        } catch (err) {
            displayZone.innerHTML = `❌ System Telemetry Failure: ${err.message}`;
        }
    }

    window.onload = loadAndCompileMarkdownAsset;
</script>
</body>
</html>
