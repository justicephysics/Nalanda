name: Automated Inversion Engine Run

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Selected System Vector'
        required: true
        default: 'Gross Domestic Product (GDP)'
      format:
        description: 'Target Publication Format'
        required: true
        default: 'LinkedIn Professional Article Format'

permissions:
  contents: write

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 google-generativeai

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
        run: python scripts/autonomous_engine.py

      - name: Save Output
        run: |
          git config --global user.name "humanos-bot"
          git config --global user.email "bot@humanos.network"
          mkdir -p staged_outputs
          git add staged_outputs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "ledger: save adaptive custom inversion report" && git push)
